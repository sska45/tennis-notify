name: テニスコート自動予約

on:
  # 定時実行は外部cron(cron-job.org)から workflow_dispatch で起動する
  # （通常15分間隔＋毎月22日0時の解放ブースト）。GitHubのscheduleは遅延・
  # スキップが多いため使わない。外部cronは body に {"inputs":{"dryrun":"false"}}
  # を渡して本番予約する（手動UI起動は既定 dryrun=true で安全）。
  workflow_dispatch:
    inputs:
      dryrun:
        description: "確定せず確認画面手前で停止（true/false）"
        required: false
        default: "true"

concurrency:
  group: tennis-reserve
  cancel-in-progress: false

jobs:
  reserve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: restore reserved state
        uses: actions/cache@v4
        with:
          path: reserved.json
          key: tennis-reserved-${{ github.run_id }}
          restore-keys: tennis-reserved-
      # Pythonパッケージ(PyPI)は軽いので毎回入れる。ブラウザ本体とOS依存(apt)は重く、
      # Ubuntuミラー障害で失敗しやすいので、対象枠が空いている時だけ入れる。
      - name: install python packages
        run: pip install playwright requests
      - name: check availability
        id: check
        run: python auto_reserve.py
        env:
          CHECK_ONLY: "1"
          WEEKS_AHEAD: "6"
      - name: install browser
        if: steps.check.outputs.has_targets == 'true'
        run: python -m playwright install --with-deps chromium
      - name: run auto reserve
        if: steps.check.outputs.has_targets == 'true'
        run: python auto_reserve.py
        env:
          TOMIN_USER_ID: ${{ secrets.TOMIN_USER_ID }}
          TOMIN_PASSWORD: ${{ secrets.TOMIN_PASSWORD }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESERVE_NOTIFY_TO: ${{ secrets.GMAIL_USER }}
          AUTO_RESERVE_DRYRUN: ${{ github.event.inputs.dryrun || 'false' }}
          WEEKS_AHEAD: "6"
      - name: upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reserve-artifacts-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
